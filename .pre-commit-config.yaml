repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
        language: system
        files: ^rust/.*\.(rs|toml)$
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^rust/.*\.(rs|toml|lock)$
        pass_filenames: false
