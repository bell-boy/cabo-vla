[project]
name = "cabo_vla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "flax>=0.12.10",
    "huggingface-hub>=2.2.0",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
    "optax>=0.2.8",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/cabo_vla"]

[tool.ruff]
target-version = "py312"
line-length = 160
src = ["python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Jaxtyping shape strings are not Python forward references.
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
# Jaxtyping shape strings are not Python forward references.
"python/cabo_vla/data/dataloader.py" = ["F722"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
